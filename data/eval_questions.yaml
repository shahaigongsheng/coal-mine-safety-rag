# 自测集：30 道煤矿专业问题
# 评分口径：Top-N 结果中，只要命中 expect_any 任一关键词（或命中期望文件/条号）即记 1 分。
# 作用：把"感觉挺准"变成可量化的召回指标 —— 这是面试时能讲的数据。
- q: 架空乘人装置的乘人间距有何规定
  expect_any: [乘人间距, 间距不得小于, 吊椅中心至巷道一侧]
  domain: 运输

- q: 采用架空乘人装置运送人员应当遵守哪些规定
  expect_any: [专项设计, 架空乘人装置运送人员]
  domain: 运输

- q: 煤矿井下供电的三大保护是指什么
